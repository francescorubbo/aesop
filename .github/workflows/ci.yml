name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

  mnist-example:
    name: MNIST Example Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build CLI
        run: |
          npm install
          npm run build
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        working-directory: examples/mnist

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        working-directory: examples/mnist

      - name: Install dependencies
        run: uv sync
        working-directory: examples/mnist

      - name: Run experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          export PATH="$PWD/node_modules/.bin:$HOME/.local/bin:$PATH"
          aesop run "Add one more hidden layer with 256 neurons to improve accuracy"
        working-directory: examples/mnist
